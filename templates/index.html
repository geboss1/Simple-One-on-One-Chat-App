<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Simple Chat App</title>
  <style>
    body { max-width: 600px; margin: 2rem auto; font-family: Arial, sans-serif; }
    #chat { border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
    #message { width: 80%; }
    #send { width: 18%; }
    #status { color: gray; font-style: italic; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h1>Simple One-on-One Chat</h1>

  <input id="username" placeholder="Your name" />
  <input id="room" placeholder="Room name (e.g. chat1)" />
  <button id="joinBtn">Join Chat</button>

  <div id="status"></div>
  <div id="chat"></div>

  <input id="message" placeholder="Type a message" disabled />
  <button id="send" disabled>Send</button>

  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js" crossorigin="anonymous"></script>
  <script src="/static/main.js"></script>
</body>
</html>
